<meta charset="utf-8">
<title>Plant Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="plant-preview.css">
<style>
/* Layout: one reading column; the shared renderer (plant-preview.js) draws the
   timeline, the selected breakdown, batches, certification and the tables. */
:root {
  --bg: #eef1f3; --panel: #ffffff; --ink: #142028; --muted: #5a6b76; --rule: #d6dde2; --chip: #e5eaee;
  --accent: #2f6fdb;
  --run: #2e8b6a; --change: #c98a1b; --down: #c8413b; --maint: #7a5cc8; --minor: #e07b39; --idle: #b8c2c9;
  --warn-band: rgba(200,65,59,.10);
  --ph1: #1f6f54; --ph2: #2e8b6a; --ph3: #4aa585; --ph4: #6dbfa0; --ph5: #2a7f8f; --ph6: #4b9fb0;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1418; --panel: #172027; --ink: #e2e9ee; --muted: #93a3ae; --rule: #2a3640; --chip: #22303a;
  --accent: #6c9cf0; --run: #4fbf95; --change: #e2a94a; --down: #ef6b64; --maint: #a68cf0; --minor: #f19a5e; --idle: #4b5862;
  --ph1: #2f8f6c; --ph2: #4fbf95; --ph3: #7ad3b1; --ph4: #a3e3c9; --ph5: #3aa3b5; --ph6: #6cc3d3;
  --warn-band: rgba(239,107,100,.14); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #172027; --ink: #e2e9ee; --muted: #93a3ae; --rule: #2a3640; --chip: #22303a;
  --accent: #6c9cf0; --run: #4fbf95; --change: #e2a94a; --down: #ef6b64; --maint: #a68cf0; --minor: #f19a5e; --idle: #4b5862;
  --ph1: #2f8f6c; --ph2: #4fbf95; --ph3: #7ad3b1; --ph4: #a3e3c9; --ph5: #3aa3b5; --ph6: #6cc3d3;
  --warn-band: rgba(239,107,100,.14); color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; font-size: 2.1rem; font-weight: 700; }
header { display: grid; gap: 8px; }
header p { margin: 0; max-width: 70ch; color: var(--muted); }
.eyebrow { font: 500 .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Plant simulation · offline preview</div>
    <h1 id="page-title">Plant preview</h1>
    <p id="intro">Simulated on one clock. Orders drive the lines, breakdowns show up in the signals first, the detector opens a maintenance ticket, and the line stays down until a technician completes it. Nothing has been written to Postgres or Historian.</p>
  </header>
  <div class="pp" id="preview"><p>Loading…</p></div>
</div>

<script src="plant-preview.js"></script>
<script>
// page-data.json is written by scripts/render_plant_preview.py: { title, notes, preview }.
fetch('page-data.json').then(r => r.json()).then(page => {
  const data = PlantPreviewRenderer.fromPreview(page.preview, { title: page.title, notes: page.notes });
  document.getElementById('page-title').textContent = data.title || data.simulation;
  document.title = (data.title || data.simulation) + ' preview';
  PlantPreviewRenderer.render(document.getElementById('preview'), data);
}).catch(() => { document.getElementById('preview').innerHTML = '<p>Preview data did not load. Reload the page.</p>'; });
</script>
