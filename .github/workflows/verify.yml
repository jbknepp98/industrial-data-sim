name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: dotnet restore IndustrialDataSim.slnx
      - run: dotnet build IndustrialDataSim.slnx --configuration Release --no-restore --disable-build-servers
      - run: dotnet test IndustrialDataSim.slnx --configuration Release --no-build --no-restore
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/verify_offline.py
      - run: python -O scripts/verify_host.py
      - run: python -O scripts/measure_host_capacity.py --history 0 --seconds 5 --diagnose
      # Synthetic only. Correctness is checked; speed varies by hosted runner.
      - run: dotnet tools/IndustrialDataSim.CapacityProbe/bin/Release/net10.0/IndustrialDataSim.CapacityProbe.dll constant 1000
